<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIS.Asyut | Hussein Mahmoud</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { 
            --neon: #00e5ff; 
            --accent: #7000ff;
            --card-bg: rgba(15, 23, 42, 0.9); 
            --glass: rgba(255, 255, 255, 0.05);
        }
        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; transition: 0.3s; }
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #020617; color: white; }
        
        /* Background Map Animation */
        #map { position: absolute; top: 0; bottom: 0; width: 100%; z-index: 1; filter: brightness(0.6) contrast(1.2); }
        
        /* Glassmorphism Overlays */
        .navbar { 
            background: var(--card-bg); 
            backdrop-filter: blur(10px);
            padding: 15px 25px; 
            display: flex; justify-content: space-between; align-items: center; 
            border-bottom: 2px solid var(--neon); 
            position: relative; z-index: 1000; 
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }
        
        .logo { font-size: 24px; font-weight: 900; color: var(--neon); text-shadow: 0 0 10px var(--neon); letter-spacing: 1px; }

        .view-section { display: none; position: relative; z-index: 100; height: calc(100vh - 70px); flex-direction: column; }
        .content-wrapper { padding: 25px; flex: 1; overflow-y: auto; scroll-behavior: smooth; }

        /* Enhanced Cards */
        .category-btn { 
            background: var(--glass); 
            border: 1px solid rgba(0, 229, 255, 0.3); 
            padding: 35px; border-radius: 24px; margin-bottom: 20px; 
            text-align: center; cursor: pointer; backdrop-filter: blur(5px);
        }
        .category-btn:hover { 
            background: rgba(0, 229, 255, 0.1); 
            transform: translateY(-5px); 
            border-color: var(--neon);
            box-shadow: 0 10px 20px rgba(0, 229, 255, 0.2);
        }

        .big-button-card { 
            background: var(--card-bg); 
            border-right: 4px solid var(--neon); 
            padding: 20px; border-radius: 15px; 
            display: flex; justify-content: space-between; align-items: center; 
            margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.1);
        }

        /* Auth Screen */
        #authBox { display: flex; position: fixed; inset: 0; z-index: 2000; justify-content: center; align-items: center; background: radial-gradient(circle, rgba(15,23,42,0.8) 0%, #000 100%); }
        .auth-card { 
            background: var(--card-bg); border: 1px solid var(--neon); 
            padding: 40px; border-radius: 30px; width: 90%; max-width: 400px; 
            text-align: center; backdrop-filter: blur(20px);
            box-shadow: 0 0 40px rgba(0, 229, 255, 0.15);
        }

        input, select { 
            width: 100%; padding: 14px; margin-bottom: 15px; border-radius: 12px; 
            border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); 
            color: white; text-align: center; outline: none;
        }
        input:focus { border-color: var(--neon); box-shadow: 0 0 10px rgba(0, 229, 255, 0.2); }

        .action-btn { 
            background: linear-gradient(135deg, var(--neon), var(--accent)); 
            color: white; padding: 12px 25px; border-radius: 12px; 
            font-weight: 700; border: none; cursor: pointer; text-transform: uppercase;
        }
        .action-btn:active { transform: scale(0.95); }

        /* Search Bar */
        .search-box { width: 100%; padding: 10px; margin-bottom: 20px; border-radius: 10px; border: 1px solid var(--neon); background: none; color: white; }

        .footer-credit { position: fixed; bottom: 15px; width: 100%; text-align: center; z-index: 1000; font-size: 14px; opacity: 0.8; }
        .footer-credit b { color: var(--neon); }
        .hidden { display: none !important; }

        /* Loader */
        #loader { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 4px; background: var(--neon); z-index: 3000; animation: loading 2s infinite; }
        @keyframes loading { 0% { left: -100%; width: 30%; } 100% { left: 100%; width: 10%; } }
    </style>
</head>
<body>

    <div id="loader"></div>
    <div id="map"></div>
    
    <div class="footer-credit">
        Designed with ❤️ by <a href="https://www.instagram.com/hussin_mahmoud1" target="_blank" style="text-decoration:none;"><b>Hussein Mahmoud</b></a>
    </div>

    <div id="authBox">
        <div class="auth-card">
            <div class="logo" id="authTitle" style="margin-bottom: 25px;">GIS.ASYUT</div>
            <div id="authInputs">
                <input type="text" id="uName" placeholder="اسم المستخدم">
                <input type="text" id="uPhone" class="hidden" placeholder="رقم الهاتف">
                <input type="password" id="uPass" placeholder="كلمة السر">
                <button id="authBtn" class="action-btn" style="width: 100%;" onclick="runAuth()">دخول</button>
            </div>
            <p onclick="swap()" style="cursor:pointer; color:#9ca3af; margin-top:20px; font-size: 14px;">
                <span id="swapText">ليس لديك حساب ؟</span> <b style="color:var(--neon)" id="swapLink">إنشاء حساب</b>
            </p>
        </div>
    </div>

    <div id="homeView" class="view-section">
        <div class="navbar">
            <div class="logo">GIS.ASYUT</div>
            <button onclick="logout()" style="background:rgba(255, 61, 0, 0.2); color:#ff3d00; border:1px solid #ff3d00; padding:6px 15px; border-radius:8px; cursor:pointer; font-weight:bold;">خروج</button>
        </div>
        <div class="content-wrapper">
            <div id="categories">
                <div class="category-btn" onclick="toggleCategory('video')">
                    <i class="fas fa-play-circle fa-2x" style="color: var(--neon); margin-bottom: 10px;"></i>
                    <h2>فيديوهات الشرح</h2>
                </div>
                <div class="category-btn" onclick="toggleCategory('book')">
                    <i class="fas fa-book fa-2x" style="color: #ffeb3b; margin-bottom: 10px;"></i>
                    <h2>الكتب والمذكرات</h2>
                </div>
                <div class="category-btn" onclick="toggleCategory('exam')">
                    <i class="fas fa-edit fa-2x" style="color: #4caf50; margin-bottom: 10px;"></i>
                    <h2>الامتحانات أونلاين</h2>
                </div>
            </div>
            
            <div id="list-container" class="hidden">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <button onclick="backToCats()" style="color:var(--neon); background:none; border:none; cursor:pointer; font-weight:bold;"><i class="fas fa-arrow-right"></i> العودة</button>
                    <input type="text" id="searchBar" class="search-box" placeholder="بحث عن درس..." onkeyup="searchItems()" style="width: 60%; margin:0;">
                </div>
                <div id="items-render" style="margin-top:20px;"></div>
            </div>
        </div>
    </div>

    <div id="adminPanel" class="view-section">
        <div class="navbar"><div class="logo">ADMIN PANEL</div><button onclick="logout()" class="action-btn">خروج</button></div>
        <div class="content-wrapper">
            <div style="background: var(--card-bg); padding: 25px; border-radius: 20px; border: 1px solid var(--neon); max-width: 500px; margin: 0 auto 30px;">
                <h3 style="text-align:center; margin-top:0">إضافة محتوى جديد</h3>
                <input type="text" id="addName" placeholder="اسم الدرس">
                <input type="text" id="addLink" placeholder="الرابط">
                <input type="text" id="addSub" placeholder="اسم المادة">
                <select id="addType">
                    <option value="video">فيديو شرح</option>
                    <option value="book">مذكرة / كتاب</option>
                    <option value="exam">امتحان</option>
                </select>
                <button class="action-btn" style="width:100%" onclick="addItem()">إضافة المحتوى <i class="fas fa-plus"></i></button>
            </div>
            <div id="admin-list" style="max-width: 700px; margin: auto;"></div>
        </div>
    </div>

    <script>
        const API_URL = "https://sheetdb.io/api/v1/gplbafankk1f0"; 
        let allData = [];
        let currentType = '';

        // Initialize App
        window.onload = () => {
            const user = localStorage.getItem('gis_user');
            if(user) {
                if(user === "admin") { showView('adminPanel'); loadAdminData(); }
                else { showView('homeView'); fetchAll(); }
            }
        };

        // Map Logic
        var map = L.map('map', { zoomControl: false, attributionControl: false }).setView([27.1850, 31.1850], 14);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);
        
        let moveLng = 31.1850;
        function autoMove() { 
            moveLng += 0.00003; 
            map.panTo([27.1850, moveLng], {animate: true, duration: 3}); 
            requestAnimationFrame(autoMove); 
        }
        autoMove();

        // UI Logic
        function showLoader(show) { document.getElementById('loader').style.display = show ? 'block' : 'none'; }

        function swap() {
            const isReg = document.getElementById('uPhone').classList.toggle('hidden');
            document.getElementById('authTitle').innerText = isReg ? "GIS.ASYUT" : "إنشاء حساب";
            document.getElementById('authBtn').innerText = isReg ? "دخول" : "تسجيل";
            document.getElementById('swapText').innerText = isReg ? "ليس لديك حساب ؟" : "لديك حساب بالفعل ؟";
            document.getElementById('swapLink').innerText = isReg ? "إنشاء حساب" : "تسجيل الدخول";
        }

        function showView(id) {
            document.getElementById('authBox').style.display = 'none';
            document.querySelectorAll('.view-section').forEach(v => v.style.display = 'none');
            document.getElementById(id).style.display = 'flex';
        }

        // Auth
        async function runAuth() {
            const u = document.getElementById('uName').value.trim();
            const p = document.getElementById('uPass').value.trim();
            const ph = document.getElementById('uPhone').value.trim();
            const isReg = document.getElementById('authBtn').innerText === "تسجيل";

            if(!u || !p) { alert("املا البيانات يا بطل!"); return; }
            showLoader(true);

            if(u === "777" && p === "s7s" && !isReg) {
                localStorage.setItem('gis_user', 'admin');
                location.reload();
                return;
            }

            try {
                if(isReg) {
                    await fetch(API_URL, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ data: [{user: u, pass: p, phone: ph, type: 'user'}] })
                    });
                    alert("تم إنشاء حسابك بنجاح!");
                    location.reload();
                } else {
                    const res = await fetch(API_URL);
                    const users = await res.json();
                    const found = users.find(row => row.user == u && row.pass == p);
                    if(found) {
                        localStorage.setItem('gis_user', u);
                        showView('homeView'); fetchAll();
                    } else { alert("بيانات غلط يا هندسة!"); }
                }
            } catch(e) { alert("خطأ في الشبكة"); }
            showLoader(false);
        }

        // Data Management
        async function fetchAll() {
            showLoader(true);
            const r = await fetch(API_URL);
            allData = await r.json();
            showLoader(false);
        }

        function toggleCategory(type) {
            currentType = type;
            document.getElementById('categories').classList.add('hidden');
            document.getElementById('list-container').classList.remove('hidden');
            renderItems(allData.filter(i => i.type === type));
        }

        function renderItems(data) {
            const container = document.getElementById('items-render');
            container.innerHTML = data.length ? "" : "<p style='text-align:center'>مفيش محتوى لسه هنا..</p>";
            data.forEach(item => {
                if(!item.name) return;
                container.innerHTML += `
                    <div class="big-button-card animated fadeIn">
                        <div>
                            <div style="font-weight:bold; font-size:18px;">${item.name}</div>
                            <small style="color:var(--neon)"><i class="fas fa-tag"></i> ${item.subject}</small>
                        </div>
                        <button class="action-btn" onclick="window.open('${item.link}', '_blank')">فتح <i class="fas fa-external-link-alt"></i></button>
                    </div>`;
            });
        }

        function searchItems() {
            const term = document.getElementById('searchBar').value.toLowerCase();
            const filtered = allData.filter(i => i.type === currentType && i.name.toLowerCase().includes(term));
            renderItems(filtered);
        }

        function backToCats() {
            document.getElementById('categories').classList.remove('hidden');
            document.getElementById('list-container').classList.add('hidden');
        }

        // Admin Actions
        async function loadAdminData() {
            showLoader(true);
            const r = await fetch(API_URL);
            const data = await r.json();
            const list = document.getElementById('admin-list');
            list.innerHTML = "<h4>المحتوى الحالي:</h4>";
            data.filter(i => i.name).forEach(item => {
                list.innerHTML += `
                    <div class="big-button-card">
                        <span>${item.name} (${item.type})</span>
                        <button onclick="deleteItem('${item.name}')" style="background:none; border:none; color:#ff3d00; cursor:pointer"><i class="fas fa-trash"></i> حذف</button>
                    </div>`;
            });
            showLoader(false);
        }

        async function addItem() {
            const n = document.getElementById('addName').value, l = document.getElementById('addLink').value,
                  s = document.getElementById('addSub').value, t = document.getElementById('addType').value;
            if(!n || !l) return;
            showLoader(true);
            await fetch(API_URL, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ data: [{name: n, link: l, subject: s, type: t}] })
            });
            alert("تمت الإضافة!"); loadAdminData();
        }

        async function deleteItem(name) {
            if(!confirm("متأكد إنك عايز تحذف؟")) return;
            showLoader(true);
            await fetch(`${API_URL}/name/${encodeURIComponent(name)}`, { method: 'DELETE' });
            loadAdminData();
        }

        function logout() { localStorage.removeItem('gis_user'); location.reload(); }
    </script>
</body>
</html>
